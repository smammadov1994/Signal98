<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>signal98 browser demo</title>
  </head>
  <body style="font-family: sans-serif; padding: 2rem; max-width: 560px;">
    <h1>signal98 browser demo</h1>
    <p>
      Serves the SDK straight from <code>src/</code> as an ES module — no build step.
      Start the example server (<code>node example/server.js</code>), serve this
      folder (<code>npx serve example</code>), open the page, and click the buttons.
      Events POST to <code>http://localhost:8787/api/ingest</code>.
    </p>
    <p>
      <button id="boom">throw uncaught error</button>
      <button id="rej">unhandled rejection</button>
      <button id="manual">manual captureException</button>
    </p>
    <script type="module">
      import { init, captureException, wrap } from "../src/index.js";

      init({ endpoint: "http://localhost:8787/api/ingest", environment: "demo" });

      document.getElementById("boom").onclick = () => {
        throw new Error("user clicked the boom button");
      };
      document.getElementById("rej").onclick = () => {
        Promise.reject(new Error("avatar upload failed"));
      };
      const saveSettings = wrap(
        () => {
          try {
            JSON.parse("nope");
          } catch (e) {
            captureException(e, { where: "settings-save" });
          }
        },
        { name: "settings-save" }
      );
      document.getElementById("manual").onclick = saveSettings;
    </script>
  </body>
</html>
